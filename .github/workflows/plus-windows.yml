# FilmCraft Plus (personal fork): builds a Windows x64 release tuned for an Intel Core Ultra 7
# 270K Plus (Arrow Lake-S: AVX2, FMA, AVX-VNNI) with an NVIDIA RTX 2080 (NVDEC / NVENC, D3D12 /
# Vulkan). Not part of upstream CI: the upstream release workflow needs signing secrets this fork
# does not have, so the build here is unsigned.
#
# Download: Actions ▸ "FilmCraft Plus Windows build" ▸ latest run ▸ Artifacts, or the
# "plus-latest" release that the push to main updates.
name: FilmCraft Plus Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plus-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # Code for this exact CPU family. Build scripts are compiled for the build machine (an
      # explicit --target keeps RUSTFLAGS away from them), so the runner's CPU does not matter.
      RUSTFLAGS: "-C target-cpu=arrowlake-s"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Fonts (Japanese UI / titles)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/storytold/craft-fonts ../craft-fonts || true
          if [ -d ../craft-fonts ]; then echo "CRAFT_FONTS_DIR=$(cd ../craft-fonts && pwd -W)" >> "$GITHUB_ENV"; fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: plus-arrowlake
      - name: Build
        run: cargo build --release --locked -p filmcraft --features whisper --target x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: |
          $out = "FilmCraft-Plus-windows-x64"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/filmcraft.exe "$out/FilmCraft Plus.exe"
          Copy-Item LICENSE-MIT, LICENSE-APACHE, NOTICE, ATTRIBUTION.md $out
          Copy-Item docs/plus.md "$out/LIESMICH.md"
          Compress-Archive -Path "$out/*" -DestinationPath "$out.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: FilmCraft-Plus-windows-x64
          path: FilmCraft-Plus-windows-x64.zip
      - name: Update the plus-latest release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete plus-latest --yes --cleanup-tag || true
          gh release create plus-latest FilmCraft-Plus-windows-x64.zip \
            --title "FilmCraft Plus (Windows, neuester Stand)" \
            --notes "Automatischer Build von ${GITHUB_SHA::7}. ZIP entpacken und 'FilmCraft Plus.exe' starten." \
            --prerelease
